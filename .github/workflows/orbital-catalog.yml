# Daily catalog bake. GitHub runners run `npm run fetch:space-track`.
# Vercel deploys from main when the public/data catalog files change.
#
# Daily kickoff ~9:23 America/New_York (staggered after Heat at 9:17;
# after FR PI ~8:45). Odd minute to reduce Actions :00/:30 queue delay.
# timezone field keeps the slot on ET through DST. Actions cron can
# still drift; workflow_dispatch remains for manual runs.
#
# Email (optional): repo Actions secrets —
#   BAKE_NOTIFY_TO   your inbox
#   BAKE_SMTP_HOST   e.g. smtp.gmail.com
#   BAKE_SMTP_PORT   587
#   BAKE_SMTP_USER   SMTP login (usually the Gmail address)
#   BAKE_SMTP_PASS   app password (not the normal Gmail password)
# Space-Track login (required):
#   SPACE_TRACK_IDENTITY
#   SPACE_TRACK_PASSWORD
# Without mail secrets the bake still ships; before/after is always in the job summary.
name: Catalog bake

on:
  schedule:
    - cron: "23 9 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch without committing or pushing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: orbital-catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Bake satellite catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BAKE_NOTIFY_TO: ${{ secrets.BAKE_NOTIFY_TO }}
      BAKE_SMTP_HOST: ${{ secrets.BAKE_SMTP_HOST }}
      BAKE_SMTP_PORT: ${{ secrets.BAKE_SMTP_PORT }}
      BAKE_SMTP_USER: ${{ secrets.BAKE_SMTP_USER }}
      BAKE_SMTP_PASS: ${{ secrets.BAKE_SMTP_PASS }}
      SPACE_TRACK_IDENTITY: ${{ secrets.SPACE_TRACK_IDENTITY }}
      SPACE_TRACK_PASSWORD: ${{ secrets.SPACE_TRACK_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json engines.node is "20.x" — setup-node reads that file.
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot before
        run: node scripts/catalog-report.mjs --snapshot-before /tmp/catalog-before.json

      - name: Fetch satellite catalog
        id: fetch
        continue-on-error: true
        run: |
          set -euo pipefail
          if npm run fetch:space-track; then
            echo "Fetch succeeded."
          else
            echo "Fetch exited non-zero. Retrying once..."
            npm run fetch:space-track
          fi

      - name: Write before/after report
        id: report
        if: always()
        run: |
          set -euo pipefail
          ok=true
          note=""
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            ok=false
            note="Fetch failed. No commit."
          fi
          node scripts/catalog-report.mjs \
            --before /tmp/catalog-before.json \
            --ok "$ok" \
            --note "$note" \
            --out /tmp/bake-report.md
          cat /tmp/bake-report.md >> "$GITHUB_STEP_SUMMARY"
          cp /tmp/bake-report.md /tmp/bake-report.txt

      - name: Require bake
        id: gate
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "::error::Catalog fetch failed."
            exit 1
          fi
          echo "Fetch succeeded."

      - name: Commit and push catalog files
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            public/data/beidou-fallback.json
            public/data/debris-fallback.json
            public/data/galileo-fallback.json
            public/data/globalstar-fallback.json
            public/data/glo-ops-fallback.json
            public/data/gps-ops-fallback.json
            public/data/intelsat-fallback.json
            public/data/iridium-NEXT-fallback.json
            public/data/kuiper-fallback.json
            public/data/oneweb-fallback.json
            public/data/planet-fallback.json
            public/data/qianfan-fallback.json
            public/data/rocket-fallback.json
            public/data/spire-fallback.json
            public/data/starlink-fallback.json
            public/data/stations-fallback.json
            public/data/unknown-fallback.json
            public/data/weather-fallback.json
          )

          git add -- "${files[@]}"

          if git diff --cached --quiet; then
            echo "No catalog file changes — nothing to commit."
            exit 0
          fi

          extra="$(git diff --cached --name-only | grep -v \
            -e '^public/data/beidou-fallback.json$' \
            -e '^public/data/debris-fallback.json$' \
            -e '^public/data/galileo-fallback.json$' \
            -e '^public/data/globalstar-fallback.json$' \
            -e '^public/data/glo-ops-fallback.json$' \
            -e '^public/data/gps-ops-fallback.json$' \
            -e '^public/data/intelsat-fallback.json$' \
            -e '^public/data/iridium-NEXT-fallback.json$' \
            -e '^public/data/kuiper-fallback.json$' \
            -e '^public/data/oneweb-fallback.json$' \
            -e '^public/data/planet-fallback.json$' \
            -e '^public/data/qianfan-fallback.json$' \
            -e '^public/data/rocket-fallback.json$' \
            -e '^public/data/spire-fallback.json$' \
            -e '^public/data/starlink-fallback.json$' \
            -e '^public/data/stations-fallback.json$' \
            -e '^public/data/unknown-fallback.json$' \
            -e '^public/data/weather-fallback.json$' \
            || true)"
          if [ -n "${extra}" ]; then
            echo "::error::Refusing to commit unexpected staged files:"
            echo "${extra}"
            exit 1
          fi

          git commit -m "Refresh OrbitalView satellite catalog."
          git push
        env:
          # Default GITHUB_TOKEN with contents: write. If main is protected and
          # blocks this push, allow github-actions[bot] (or "Allow specified
          # actors to bypass required pull requests") rather than adding a PAT.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run — skip commit
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run — fetch finished; no commit or push."

      - name: Mail before/after report
        if: ${{ always() && steps.report.outcome == 'success' && env.BAKE_NOTIFY_TO != '' && env.BAKE_SMTP_HOST != '' && env.BAKE_SMTP_USER != '' && env.BAKE_SMTP_PASS != '' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ env.BAKE_SMTP_HOST }}
          server_port: ${{ env.BAKE_SMTP_PORT != '' && env.BAKE_SMTP_PORT || 587 }}
          secure: false
          username: ${{ env.BAKE_SMTP_USER }}
          password: ${{ env.BAKE_SMTP_PASS }}
          subject: ${{ steps.gate.outcome == 'success' && 'Orbital catalog bake · SUCCESS' || 'Orbital catalog bake · FAIL' }}
          to: ${{ env.BAKE_NOTIFY_TO }}
          from: Orbital catalog bake <${{ env.BAKE_SMTP_USER }}>
          body: file:///tmp/bake-report.txt
          html_body: file:///tmp/bake-report.md

      - name: Note when mail secrets are missing
        if: ${{ always() && (env.BAKE_NOTIFY_TO == '' || env.BAKE_SMTP_HOST == '' || env.BAKE_SMTP_USER == '' || env.BAKE_SMTP_PASS == '') }}
        run: |
          echo "Mail skipped — add BAKE_NOTIFY_TO, BAKE_SMTP_HOST, BAKE_SMTP_PORT (587), BAKE_SMTP_USER, BAKE_SMTP_PASS under Settings → Secrets → Actions. Report is in the job summary."
